<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Softech | Edit Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <a href="index.html" class="navbar-brand">← Back to Student List</a>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <div class="card p-4 shadow-lg">
      <h3 class="mb-4 text-center text-primary">Edit Student</h3>

      <form id="editForm" enctype="multipart/form-data">
        <input type="hidden" id="studentId">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" id="name" class="form-control" required>
          </div>

          <div class="col-md-3">
            <label class="form-label">Age</label>
            <input type="number" id="age" class="form-control" required>
          </div>

          <div class="col-md-3">
            <label class="form-label">Phone</label>
            <input type="text" id="phone" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Address</label>
            <input type="text" id="address" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label">State</label>
            <select id="stateId" class="form-select" required></select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Photo</label>
            <input type="file" id="photo" class="form-control">
            <small class="text-muted">Leave empty to keep existing photo</small>
          </div>
        </div>

        <hr class="my-4">

        <h5>Subjects</h5>
        <table class="table table-bordered" id="subjectTable">
          <thead>
            <tr>
              <th>Subject Name</th>
              <th class="text-center" width="100">Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <button type="button" id="addSubject" class="btn btn-outline-primary btn-sm mb-3">+ Add Subject</button>

        <div class="text-center">
          <button type="submit" class="btn btn-success px-4">Update Student</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/edit.js"></script>
</body>
</html>
